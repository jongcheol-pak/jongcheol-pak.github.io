# DevHub: GitHub Pages 자동 배포 워크플로우
# - 매일 UTC 00:00 (KST 09:00) 자동 재빌드 (GitHub 최신 저장소 반영)
# - main 브랜치 push 시 재빌드
# - 수동 트리거 지원 (workflow_dispatch)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # 매일 UTC 자정 (KST 09:00)
  workflow_dispatch:

# GitHub Pages 배포 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 충돌 방지
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # C-3: Lighthouse 워크플로우의 [lighthouse] prefix 커밋이면 deploy 트리거 루프 차단
    # head_commit 은 push 이벤트에서만 존재 — schedule/workflow_dispatch 는 null 평가 → if 통과
    if: ${{ !startsWith(github.event.head_commit.message, '[lighthouse]') && !startsWith(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # M-5: Node 22 LTS (codename "jod") 별칭 사용 — 마이너 패치는 자동 수신, major 변경은 차단
          node-version: 'lts/jod'
          cache: 'npm'

      - name: Install dependencies
        # C-4: sharp 의 platform-specific 바이너리(@img/sharp-linux-x64) 가 optionalDependencies 라
        # --include=optional 가 있어야 Linux runner 에서 정상 설치된다 (plan v3 단일화 결정)
        run: npm ci --include=optional

      - name: Build Astro site
        # GITHUB_TOKEN 은 GitHub Actions 가 자동 주입 (public 저장소 읽기 권한 포함)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      # M-1: E2E 회귀 테스트 — Playwright 가 webServer 로 `npm run preview` 를 자동 기동(localhost:4321)
      # 빌드된 dist 를 그대로 검사하므로 artifact upload 와 독립적. 실패 시 다음 step(upload) 차단 → deploy 도 needs 로 스킵.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
