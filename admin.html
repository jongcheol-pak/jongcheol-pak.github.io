---
layout: default
title: 프로젝트 생성기
---

<div class="container" style="padding-top: 80px;">

    <div
        style="max-width: 800px; margin: 0 auto; background: var(--bg-card); border: 5px solid black; box-shadow: 8px 8px 0px 0px var(--neo-secondary); padding: 40px;">
        <h2
            style="font-size: 2.5rem; color: white; margin-bottom: 32px; border-bottom: 4px solid var(--neo-secondary); padding-bottom: 16px; display: inline-block;">
            새 프로젝트 등록</h2>

        <form id="generator-form" style="display: flex; flex-direction: column; gap: 24px;">

            <div>
                <label
                    style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary); cursor: pointer;">
                    <input type="checkbox" id="p-hidden" style="width: 16px; height: 16px;"> 목록 숨김 (HIDE FROM LIST)
                </label>
                <label style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary);">프로젝트 ID
                    (URL SLUG)</label>
                <input type="text" id="p-slug" class="neo-input" placeholder="예: super-mario-clone (영문, 숫자, 하이픈만 가능)">
                <p style="color: gray; font-size: 0.8rem; margin-top: 4px;">* 이 ID는 이미지 폴더명과 파일명으로 사용됩니다.</p>
            </div>

            <div>
                <label style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary);">프로젝트 제목
                    (TITLE)</label>
                <input type="text" id="p-title" class="neo-input" placeholder="예: 슈퍼 마리오 클론" oninput="autoFillSlug()">
            </div>



            <div>
                <label style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary);">설명
                    (DESCRIPTION)</label>
                <input type="text" id="p-desc" class="neo-input" placeholder="프로젝트에 대한 간단한 설명을 입력하세요">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <div>
                    <label style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary);">버전
                        (VERSION)</label>
                    <input type="text" id="p-version" class="neo-input" placeholder="v1.0">
                </div>
                <div>
                    <label style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary);">플랫폼
                        (PLATFORM)</label>
                    <select id="p-platform" class="neo-input" style="color: white; background:black;">
                        <option value="Windows">Windows</option>
                        <option value="Android">Android</option>
                        <option value="iOS">iOS</option>
                        <option value="Unity">Unity</option>
                        <option value="Web">Web</option>
                        <option value="AWS">AWS</option>
                        <option value="Google Cloud">Google Cloud</option>
                        <option value="AI">AI</option>
                        <option value="IoT">IoT</option>
                    </select>
                </div>
            </div>

            <div>
                <label style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary);">카테고리
                    (CATEGORY)</label>
                <select id="p-category" class="neo-input" style="color: white; background:black;">
                    <option value="game">게임 (GAME)</option>
                    <option value="program">프로그램 (PROGRAM)</option>
                </select>
            </div>

            <div>
                <label style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary);">메인 이미지
                    (LIVE SYSTEM VIEW)</label>
                <div
                    style="background: black; padding: 16px; border: 4px solid var(--neo-primary); margin-bottom: 16px;">
                    <label style="color: white; display: block; margin-bottom: 8px; font-size: 0.9rem;">메인 이미지 업로드
                        (MAIN UPLOAD):</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="file" id="p-main-image-upload" class="neo-input" accept="image/*"
                            style="padding: 8px;">
                        <button type="button" class="neo-button" onclick="uploadMainImage()"
                            style="background: var(--neo-secondary); color: white;">업로드</button>
                    </div>
                </div>
                <input type="text" id="p-main-image-url" class="neo-input" placeholder="/assets/img/projects/..."
                    style="margin-bottom: 32px;">
            </div>

            <div>
                <label style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary);">추가 이미지 목
                    록 (GALLERY)</label>
                <div
                    style="background: black; padding: 16px; border: 4px solid var(--neo-primary); margin-bottom: 16px;">
                    <label style="color: white; display: block; margin-bottom: 8px; font-size: 0.9rem;">갤러리 이미지 업로드
                        (GALLERY UPLOAD):</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="file" id="p-image-upload" class="neo-input" multiple accept="image/*"
                            style="padding: 8px;">
                        <button type="button" class="neo-button" onclick="uploadImages()"
                            style="background: var(--neo-secondary); color: white;">업로드</button>
                        <label
                            style="color: white; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer;">
                            <input type="checkbox" id="img-to-content" style="width: 16px; height: 16px;"> 본문 추가
                        </label>
                    </div>
                    <p style="color: gray; font-size: 0.8rem; margin-top: 8px;">* API 서버가 켜져 있어야 합니다. 업로드 시 아래 URL 영역에
                        자동 추가됩니다.</p>
                </div>
                <label style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary);">갤러리 URL
                    목록</label>
                <textarea id="p-images" class="neo-input" rows="3"
                    placeholder="https://... 또는 /assets/img/..."></textarea>
            </div>

            <div>
                <label style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary);">링크
                    (ACCESS LINK)</label>
                <input type="text" id="p-link" class="neo-input" placeholder="https://github.com/...">
            </div>

            <div>
                <label style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary);">Github
                    코드
                    (SOURCE URL) (선택)</label>
                <input type="text" id="p-github-url" class="neo-input"
                    placeholder="https://github.com/user/project (Optional)">
            </div>

            <div>
                <label style="font-weight: 400; display: block; margin-bottom: 8px; color: var(--neo-primary);">상세 내용
                    (MARKDOWN)</label>
                <textarea id="p-content" class="neo-input" rows="6" placeholder="마크다운 형식으로 상세 내용을 작성하세요..."></textarea>
            </div>

            <button type="button" class="neo-button primary" onclick="generateCode()"
                style="margin-top: 16px; width: 100%;">코드 생성 (GENERATE)</button>
        </form>
    </div>

    <div id="output-box"
        style="display: none; max-width: 800px; margin: 40px auto; background: black; border: 4px solid var(--neo-accent); padding: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="color: var(--neo-accent);">생성된 코드 (OUTPUT)</h3>
            <div style="display: flex; gap: 10px;">
                <button type="button" class="neo-button" onclick="saveToDisk()"
                    style="padding: 5px 15px; font-size: 0.8rem; background: var(--neo-primary);">파일 저장 (SAVE)</button>
                <button type="button" class="neo-button" onclick="copyToClipboard()"
                    style="padding: 5px 15px; font-size: 0.8rem;">복사 (COPY)</button>
            </div>
        </div>
        <textarea id="output-code" rows="15" class="neo-input" readonly style="margin-top: 16px;"></textarea>
    </div>

</div>

<script>
    const API_URL = 'http://localhost:5000';
    let originalFilename = null;

    window.onload = async function () {
        const urlParams = new URLSearchParams(window.location.search);
        let projectFile = urlParams.get('project');

        if (projectFile) {
            projectFile = decodeURIComponent(projectFile);
            originalFilename = projectFile;
            document.querySelector('h2').innerText = "프로젝트 수정 (EDIT MODE)";
            document.querySelector('.neo-button.primary').innerText = "코드 업데이트 (UPDATE)";
            document.getElementById('p-slug').disabled = true; // Disable Slug Editing
            document.getElementById('p-slug').style.backgroundColor = '#333'; // Visual cue
            await loadProjectData(projectFile);
        }
    };

    async function loadProjectData(filename) {
        try {
            const response = await fetch(`${API_URL}/api/project?filename=${filename}`);
            if (!response.ok) {
                throw new Error(`Server returned ${response.status}: ${response.statusText}`);
            }
            const data = await response.json();

            if (data.status === 'success') {
                parseAndFillForm(data.content, filename);
            } else {
                alert("프로젝트를 불러오는데 실패했습니다: " + (data.message || "Unknown error"));
            }
        } catch (err) {
            console.error(err);
            alert(`프로젝트 로드 중 오류 발생:\n${err.message}`);
        }
    }

    function parseAndFillForm(fileContent, filename) {
        // Extract slug from filename if provided (e.g. 2024-02-08-12-00-my-project.md -> my-project)
        if (filename) {
            let slug = filename.replace(/\.md$/, '');
            slug = slug.replace(/^\d{4}-\d{2}-\d{2}-/, ''); // Remove Date
            slug = slug.replace(/^\d{2}-\d{2}-/, '');       // Remove Time if present
            document.getElementById('p-slug').value = slug;
        }

        // Valid YAML Front Matter Parser (lenient)
        const fmRegex = /^\s*---\s*([\s\S]*?)\s*---\s*([\s\S]*)$/;
        const match = fileContent.match(fmRegex);

        if (!match) {
            alert("파일 형식을 인식할 수 없습니다. (YAML Front Matter not found)");
            console.error("Content:", fileContent);
            return;
        }

        const frontMatter = match[1];
        const content = match[2].trim();

        // Parse key-values
        const fmLines = frontMatter.split('\n');
        const fmData = {};

        // Helper to parse images list (very basic)
        let readingImages = false;

        fmLines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            if (trimmed.startsWith('images:')) {
                readingImages = true;
                fmData['images'] = [];
                return;
            }

            if (readingImages && trimmed.startsWith('-')) {
                // Remove list marker
                let imgVal = trimmed.replace(/^-\s*/, '');
                // Unescape if it's a double-quoted string (JSON format)
                if (imgVal.startsWith('"') && imgVal.endsWith('"')) {
                    try {
                        imgVal = JSON.parse(imgVal);
                    } catch (e) {
                        // Fallback unescape
                        imgVal = imgVal.slice(1, -1).replace(/\\"/g, '"');
                    }
                } else if (imgVal.startsWith("'") && imgVal.endsWith("'")) {
                    imgVal = imgVal.slice(1, -1).replace(/\\'/g, "'");
                }
                fmData['images'].push(imgVal);
                return;
            }

            if (readingImages && !trimmed.startsWith('-')) {
                readingImages = false;
            }

            if (!readingImages && trimmed.includes(':')) {
                const parts = trimmed.split(':');
                const key = parts[0].trim();
                let value = parts.slice(1).join(':').trim();

                // Unescape values
                if (value.startsWith('"') && value.endsWith('"')) {
                    try {
                        value = JSON.parse(value);
                    } catch (e) {
                        value = value.slice(1, -1).replace(/\\"/g, '"');
                    }
                } else if (value.startsWith("'") && value.endsWith("'")) {
                    value = value.slice(1, -1).replace(/\\'/g, "'");
                }
                fmData[key] = value;
            }
        });

        // Fill Form
        if (fmData['hidden'] === 'true') document.getElementById('p-hidden').checked = true;

        const setVal = (id, val) => {
            if (val) document.getElementById(id).value = val;
        };

        setVal('p-title', fmData['title']);
        setVal('p-desc', fmData['description']);
        setVal('p-version', fmData['version']);
        setVal('p-platform', fmData['platform']);
        setVal('p-category', fmData['category']);
        setVal('p-link', fmData['link']);
        setVal('p-github-url', fmData['github_url']);
        setVal('p-main-image-url', fmData['image']); // Main Image

        if (fmData['images'] && fmData['images'].length > 0) {
            // Filter out main image from gallery list to avoid duplication if it was accidentally saved there
            const distinctImages = fmData['images'].filter(img => img !== fmData['image']);
            document.getElementById('p-images').value = distinctImages.join('\n');
        }

        document.getElementById('p-content').value = content;

        // Trigger code generation to show current state
        generateCode();
    }

    function generateCode() {
        const title = document.getElementById('p-title').value;
        const slug = document.getElementById('p-slug').value;
        const desc = document.getElementById('p-desc').value;
        const version = document.getElementById('p-version').value;
        const platform = document.getElementById('p-platform').value;
        const category = document.getElementById('p-category').value;
        const mainImageUrl = document.getElementById('p-main-image-url').value;
        const imagesRaw = document.getElementById('p-images').value;
        const link = document.getElementById('p-link').value;
        const githubUrl = document.getElementById('p-github-url').value;
        const content = document.getElementById('p-content').value;
        const isHidden = document.getElementById('p-hidden').checked;
        const date = new Date().toISOString().split('T')[0];

        // Validation
        const missingFields = [];
        if (!slug.trim()) missingFields.push("프로젝트 ID (URL SLUG)");
        if (!title.trim()) missingFields.push("프로젝트 제목 (TITLE)");
        if (!desc.trim()) missingFields.push("설명 (DESCRIPTION)");
        if (!version.trim()) missingFields.push("버전 (VERSION)");
        if (!platform.trim()) missingFields.push("플랫폼 (PLATFORM)");
        if (!category.trim()) missingFields.push("카테고리 (CATEGORY)");
        if (!mainImageUrl.trim()) missingFields.push("메인 이미지 (MAIN IMAGE)");
        // Gallery images are optional if main image is present? No, let's keep it robust.
        if (!link.trim()) missingFields.push("링크 (ACCESS LINK)");
        if (!content.trim()) missingFields.push("상세 내용 (MARKDOWN)");

        if (missingFields.length > 0) {
            alert("다음 항목을 모두 입력해주세요:\n- " + missingFields.join("\n- "));
            return;
        }

        // Process images
        const images = imagesRaw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
        let imageYaml = '';

        let thumbnail = `image: ${JSON.stringify(mainImageUrl)}`;

        if (images.length > 0) {
            imageYaml = '\nimages:\n' + images.map(img => `  - ${JSON.stringify(img)}`).join('\n');
        }

        let githubYaml = '';
        if (githubUrl && githubUrl.trim() !== '') {
            githubYaml = `github_url: ${JSON.stringify(githubUrl)}`;
        }

        const yaml = `---
layout: project
title: ${JSON.stringify(title)}
description: ${JSON.stringify(desc)}
version: ${JSON.stringify(version)}
platform: ${JSON.stringify(platform)}
date: ${date}
category: ${category}
${isHidden ? 'hidden: true\n' : ''}${thumbnail}${imageYaml}
link: ${JSON.stringify(link)}
${githubYaml}
---

${content}
`;

        document.getElementById('output-code').value = yaml;
        document.getElementById('output-box').style.display = 'block';
    }

    function copyToClipboard() {
        const copyText = document.getElementById("output-code");
        copyText.select();
        document.execCommand("copy");
        alert("클립보드에 복사되었습니다!");
    }

    async function saveToDisk() {
        const title = document.getElementById('p-title').value;
        const slug = document.getElementById('p-slug').value;

        if (!title) { alert("제목을 입력해주세요!"); return; }
        if (!slug) { alert("프로젝트 ID(URL SLUG)를 입력해주세요!"); return; }

        generateCode();
        const content = document.getElementById('output-code').value;

        let filename;
        if (originalFilename) {
            if (!confirm(`기존 파일(${originalFilename})을 덮어쓰시겠습니까?`)) return;
            filename = originalFilename;
        } else {
            // Use Project ID as filename
            const safeSlug = slug.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
            filename = `${safeSlug}.md`;
        }

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename, content })
            });

            const result = await response.json();
            if (result.status === 'success') {
                alert(`성공: 파일이 저장되었습니다.\n${result.path}\n\nJekyll 서버가 감지하여 자동으로 업데이트될 것입니다.`);
            } else {
                alert(`오류: ${result.message}`);
            }
        } catch (err) {
            alert("연결 오류: 'python scripts/local_api.py' 서버가 실행 중인지 확인해주세요.");
        }
    }

    async function uploadMainImage() {
        const fileInput = document.getElementById('p-main-image-upload');
        const files = fileInput.files;
        if (files.length === 0) { alert("파일을 선택해주세요."); return; }

        const slug = document.getElementById('p-slug').value;
        if (!slug) { alert("이미지 폴더 생성을 위해 '프로젝트 ID'를 먼저 입력해주세요!"); return; }

        const projectSlug = slug.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
        const file = files[0];
        const reader = new FileReader();

        reader.onload = async function (e) {
            const base64Str = e.target.result;
            const filename = file.name;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filename,
                        image_data: base64Str,
                        project_slug: projectSlug
                    })
                });

                const result = await response.json();
                if (result.status === 'success') {
                    document.getElementById('p-main-image-url').value = result.url;
                } else {
                    alert(`이미지 업로드 실패 (${filename}): ${result.message}`);
                }
            } catch (err) {
                console.error(err);
                alert("업로드 중 오류가 발생했습니다. 서버 상태를 확인하세요.");
            }
        };

        reader.readAsDataURL(file);
    }

    async function uploadImages() {
        // ... (existing uploadImages logic)
        const files = fileInput.files;
        if (files.length === 0) { alert("파일을 선택해주세요."); return; }

        const slug = document.getElementById('p-slug').value;
        if (!slug) { alert("이미지 폴더 생성을 위해 '프로젝트 ID'를 먼저 입력해주세요!"); return; }

        const projectSlug = slug.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');

        let textarea = document.getElementById('p-images');
        if (textarea.value && !textarea.value.endsWith('\n')) {
            textarea.value += '\n';
        }

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const reader = new FileReader();

            reader.onload = async function (e) {
                const base64Str = e.target.result;
                const filename = file.name;

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            filename,
                            image_data: base64Str,
                            project_slug: projectSlug
                        })
                    });

                    const result = await response.json();
                    if (result.status === 'success') {
                        document.getElementById('p-images').value += result.url + '\n';

                        // Insert into content if checked
                        const insertToContent = document.getElementById('img-to-content').checked;
                        if (insertToContent) {
                            const mdImage = `\n![${filename}](${result.url})\n`;
                            document.getElementById('p-content').value += mdImage;
                        }

                    } else {
                        alert(`이미지 업로드 실패 (${filename}): ${result.message}`);
                    }
                } catch (err) {
                    console.error(err);
                    alert("업로드 중 오류가 발생했습니다. 서버 상태를 확인하세요.");
                }
            };

            reader.readAsDataURL(file);
        }
    }
</script>
